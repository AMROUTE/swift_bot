services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swift-bot-postgres
    environment:
      POSTGRES_DB: swift_bot
      POSTGRES_USER: aman
      POSTGRES_PASSWORD: Aman2026
    ports:
      - "55432:5432"
    volumes:
      - swift_bot_postgres:/var/lib/postgresql/data
      - ./Backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aman -d swift_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swift_bot_postgres:
